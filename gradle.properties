#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#AGP 9.x + Kotlin Multiplatform compatibility (com.android.application/library with org.jetbrains.kotlin.multiplatform)
android.builtInKotlin=false
android.newDsl=false
#Suppress AGP deprecation warnings caused by android.newDsl=false
android.sync.suppressAgpWarnings=DEPRECATED_DSL
#Suppress KGP NonKmpAgpIsDeprecated warning (KMP + com.android.application/library is still used intentionally)
kotlin.suppressGradlePluginWarnings=NonKmpAgpIsDeprecated